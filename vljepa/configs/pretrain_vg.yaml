model:
  vision_backbone: vit_l_16
  predictor_hidden_size: 1024
  predictor_layers: 8
  predictor_heads: 16
  predictor_ffn_mult: 4
  predictor_dropout: 0.1
  query_model_name: meta-llama/Llama-3.2-1B
  y_encoder_name: google/embeddinggemma-300m
  max_query_tokens: 512
  max_target_tokens: 512
  shared_embed_dim: 1536
  freeze_x_encoder: true
  y_encoder_lr_multiplier: 0.05

data:
  train_manifests:
    - ./data/visual_genome/vg_pretrain.jsonl
  num_frames: 1
  image_size: 224
  num_workers: 8

train:
  seed: 42
  device: cuda
  precision: bf16
  output_dir: /data/vgoutputs/pretrain_vg
  batch_size: 128
  max_steps: 25000
  gradient_accumulation_steps: 1
  clip_grad_norm: 1.0
  log_every: 5000
  save_every: 12500
  learning_rate: 5.0e-5
  min_lr: 0.0
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  scheduler: constant
  temperature: 0.07
