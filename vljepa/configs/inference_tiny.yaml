model:
  vision_backbone: toy_cnn
  predictor_hidden_size: 64
  predictor_layers: 2
  predictor_heads: 4
  predictor_ffn_mult: 2
  predictor_dropout: 0.0
  query_model_name: toy
  y_encoder_name: toy
  max_query_tokens: 32
  max_target_tokens: 32
  shared_embed_dim: 64
  freeze_x_encoder: false
  y_encoder_lr_multiplier: 0.05

data:
  num_frames: 2
  image_size: 64

runtime:
  device: cpu

