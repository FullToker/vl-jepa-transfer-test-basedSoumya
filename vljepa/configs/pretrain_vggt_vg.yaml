model:
  vision_backbone: vit_l_16
  use_vggt: true
  vggt_ckpt: ./ckpts/VGGT-1B/model.pt
  predictor_hidden_size: 2048
  predictor_layers: 8
  predictor_heads: 16
  predictor_ffn_mult: 4
  predictor_dropout: 0.1
  query_model_name: meta-llama/Llama-3.2-1B
  y_encoder_name: google/embeddinggemma-300m
  max_query_tokens: 512
  max_target_tokens: 512
  shared_embed_dim: 1536
  freeze_x_encoder: true
  y_encoder_lr_multiplier: 0.05

data:
  train_manifests:
    - ./data/visual_genome/vg_pretrain.jsonl
  num_frames: 1
  image_size: 224
  num_workers: 12

mlflow:
  enabled: false

train:
  seed: 42
  device: cuda
  precision: bf16
  output_dir: outputs/pretrain_vggt_vg
  batch_size: 128
  max_steps: 20000
  gradient_accumulation_steps: 1
  clip_grad_norm: 1.0
  log_every: 50
  save_every: 10000
  learning_rate: 1.0e-4
  min_lr: 0.0
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  scheduler: constant
  temperature: 0.07
